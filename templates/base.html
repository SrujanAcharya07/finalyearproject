<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PhishOps SOAR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="brand" href="{{ url_for('dashboard') }}">PHISHOPS / SOAR</a>
    <div class="desktop-nav" aria-label="Desktop navigation">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('submit_page') }}">New investigation</a>
    </div>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
      <span aria-hidden="true">⋮</span>
    </button>
    <div class="mobile-menu" id="mobile-menu" hidden>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('submit_page') }}">New investigation</a>
      <a href="{{ url_for('settings') }}">Settings</a>
    </div>
  </nav>
  <main>
    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    (() => {
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('mobile-menu');
      if (!toggle || !menu) return;
      const close = () => {
        menu.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open menu');
      };
      toggle.addEventListener('click', () => {
        const open = menu.hidden;
        menu.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      document.addEventListener('click', (event) => {
        if (!menu.hidden && !menu.contains(event.target) && !toggle.contains(event.target)) close();
      });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
