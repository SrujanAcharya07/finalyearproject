{% extends 'base.html' %}{% block content %}<header><div><span class=eyebrow>NEW CASE</span><h1>Submit suspicious email</h1><p class=muted>Nothing is executed or visited. Content is treated as untrusted evidence.</p></div></header><section class=panel><form method=post action="{{url_for('create')}}" enctype=multipart/form-data><label>Investigation title<input name=title maxlength=200 placeholder="e.g. Invoice redirect reported by finance"></label><label>Paste email content<textarea name=content rows=18 placeholder="Paste raw email headers and body here..."></textarea></label><div class=or>OR</div><label>Upload .eml file<input type=file name=email_file accept=".eml,message/rfc822"></label><label>Optional attachment for static inspection<input type=file name=attachment></label><button class=button type=submit>Analyze safely</button></form></section>{% endblock %}
