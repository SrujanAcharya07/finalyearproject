services:
  phishops:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-phishops-playbook:local}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_PATH: /app/data/app.db
      UPLOAD_FOLDER: /app/uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-800}
      CUCKOO_URL: ${CUCKOO_URL:-}
      CUCKOO_API_KEY: ${CUCKOO_API_KEY:-}
      CORTEX_URL: ${CORTEX_URL:-}
      CORTEX_API_KEY: ${CORTEX_API_KEY:-}
      THEHIVE_URL: ${THEHIVE_URL:-}
      THEHIVE_API_KEY: ${THEHIVE_API_KEY:-}
    volumes:
      - phishops-data:/app/data
      - phishops-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  phishops-data:
  phishops-uploads:
